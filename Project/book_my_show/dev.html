<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Navbar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        .navbar-custom {
            background: white;
            padding: 10px 20px;
        }

        .search-box {
            width: 60%;
        }

        .signin-btn {
            background: #f84464;
            color: white;
            border-radius: 5px;
            padding: 5px 15px;
            font-size: 14px;
        }

        .signin-btn:hover {
            background: #e53755;
            color: white;
        }

        .logo-text span {
            color: #f84464;
            font-weight: bold;
        }

        .searchbox1 {
            max-width: 600px;
            margin: auto;
            margin-top: 20px;
            border-radius: 20%;
            width: 85%;
        }

        .category-pill {
            border-radius: 25px;
            /* padding: 6px 18px; */
            font-size: 14px;
            border: 1px solid #ddd;
            background: white;
            color: #ff4d4d;
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light navbar-custom">
        <div class="container-fluid">

            <!-- Logo -->
            <a class="navbar-brand fw-bold logo-text" href="#">
                book<img src="/new-logo-180.png" alt="" height="50" width="45">show
            </a>

            <!-- Search -->
            <form class="d-flex search-box">
                <input class="form-control" type="search"
                    placeholder="Search for Movies, Events, Plays, Sports and Activities" data-bs-toggle="modal"
                    data-bs-target="#demo">
            </form>

            <!-- Right Section -->
            <div class="d-flex align-items-center gap-3">

                <!-- Location -->
                <div class="dropdown">
                    <a class="dropdown-toggle text-dark text-decoration-none" data-bs-toggle="dropdown">
                        Ahmedabad
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item">Mumbai</a></li>
                        <li><a class="dropdown-item">Delhi</a></li>
                        <li><a class="dropdown-item">Bangalore</a></li>
                    </ul>
                </div>

                <!-- Sign In -->
                <button class="btn signin-btn">Sign in</button>

                <!-- Menu -->
                <i class="bi bi-list fs-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#demo1"></i>

            </div>

        </div>
    </nav>
    <div class="offcanvas offcanvas-end" id="demo1">
        <div class="offcanvas-header">
            <h1 class="offcanvas-title">Heading</h1>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <p>Some text lorem ipsum.</p>
            <p>Some text lorem ipsum.</p>
            <button class="btn btn-secondary" type="button">A Button</button>
        </div>
    </div>
    <br>

    <div class="modal fade" id="demo" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">

                    <!-- inner button -->
                    <div class="searchbox1">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control d-flex "
                                placeholder="Search for Movies, Events, Plays & more">
                            <button class="btn btn-outline-secondary bg-danger text-white">X</button>
                        </div>
                    </div>

                </div>
                <br>
                <!-- suggestion -->
                <div class="contaier mb-3">
                    <div id="carouselExample" class="carousel slide">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <div class="row mx-3">
                                    <div class="col">
                                        <button class="category-pill">Movies</button>
                                    </div>
                                    <div class="col">
                                        <button class="category-pill">Stream</button>
                                    </div>
                                    <div class="col">
                                        <button class="category-pill">Events</button>
                                    </div>
                                    <div class="col">
                                        <button class="category-pill">Plays</button>
                                    </div>
                                    <div class="col">
                                        <button class="category-pill">Sports</button>
                                    </div>
                                    <div class="col">
                                        <button class="category-pill">Activities</button>
                                    </div>
                                </div>
                                <!-- <div class="d-flex justify-content-center gap-3">
                                <button class="category-pill">Movies</button>
                                <button class="category-pill">Stream</button>
                                <button class="category-pill">Events</button>
                                <button class="category-pill">Plays</button>
                                <button class="category-pill">Sports</button>
                                </div> -->
                            </div>
                            <div class="carousel-item">
                                <div class="d-flex justify-content-center gap-3">
                                    <button class="category-pill">Activities</button>
                                    <button class="category-pill">Movies</button>
                                    <button class="category-pill">Stream</button>
                                </div>
                            </div>
                        </div>
                        <button class="carousel-control-prev dark" type="button" data-bs-target="#carouselExample"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon bg-dark text-dark" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
