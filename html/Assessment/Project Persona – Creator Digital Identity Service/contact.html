<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Persona">
  <title>Persona | Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="header">
    <nav class="navbar">
      <div class="logo">Persona</div>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="contact-section">

      <div class="contact-container">

        <h1>Contact Me</h1>

        <p>
          For collaborations, freelance projects, and professional inquiries,
          please fill out the form below.
        </p>

        <form class="contact-form">

          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="6" placeholder="Write your message" required></textarea>
          </div>

          <button type="submit" class="btn">Send Message</button>

        </form>

      </div>

    </section>

  </main>

  <footer class="footer">
    <p>© 2026 Persona Creator Identity Service</p>
  </footer>

  <script src="js/script.js"></script>

</body>

</html>
