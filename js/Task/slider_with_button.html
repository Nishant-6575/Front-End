<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .main {
            width: 100%;
            height: 300px;
            padding: 10px;
            overflow: hidden;

        }

        img {
            display: flex;
            margin: 10px auto;
            height: 90%;
            padding: 10px;

        }

        .btn {
            margin: 10px auto;
            text-align: center;
        }

        .bt {
            margin: 10px;
            width: 90px;
            height: 25px;
        }

        button{
            border-radius: 15px;
            border: 2px solid black;
            background-color: rgba(173, 216, 230, 0.7);
        }
    </style>
</head>

<body>
    <div class="main">
        <img src="/img/menu_01.png" alt="01" class="img_cl">
        <img src="/img/menu_02.png" alt="02" class="img_cl">
        <img src="/img/menu_03.png" alt="03" class="img_cl">
        <img src="/img/menu_04.png" alt="04" class="img_cl">
        <img src="/img/menu_05.png" alt="05" class="img_cl">
        <img src="/img/menu_06.png" alt="06" class="img_cl">
    </div>
    <div class="btn">
        <button class="pre bt" onclick="sliderdown()">Previous</button>
        <button class="next bt" onclick="sliderup()">Next</button>
    </div>

    <script>
        let img_arr = document.getElementsByClassName("img_cl")

        let img_index = 0

        function hide() {
            for (let index = 0; index < img_arr.length; index++) {
                // const element = array[index];
                img_arr[index].style.display = "none"
                // console.log(img_arr)
            }
        }

        function sliderup() {
            hide()
            if (img_index == (img_arr.length - 1)) {
                img_index = -1
            }
            img_index++
            img_arr[img_index].style.display = "block"
        }

        function sliderdown() {
            hide()
            if (img_index == 0) {
                img_index = img_arr.length
            }
            img_index--
            img_arr[img_index].style.display = "block"
        }


    </script>
</body>

</html>
