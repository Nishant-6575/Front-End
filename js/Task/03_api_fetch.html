<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .card{
            box-shadow: 0px 0px 5px 0px rgba(0, 0, 0, 0.272);
            margin: 10px 0px;
        }
    </style>

</head>

<body>
    <div class="row data_output">

    </div>

    <script>
        fetch("https://dummyjson.com/products", {
            method: "GET"
        })
            .then((res) => {
                return res.json()
            })
            .then((res) => {
                console.log(res)

                // res.products.forEach(element => {
                //     console.log(element)
                // });

                const inputdata = res.products.map((input) => {
                    console.log(input)
                    return (`
                        <div class="col-md-3">
                            <div class="card">
                                <div class="card-body">
                                    <img src="${input.images}" class="card-img-top" alt="...">
                                    <h5 class="card-title text-center">${input.title}</h5>
                                    <p class="card-text text-truncate small">${input.description}</p>
                                    <div class="text-center">
                                    <a href="#" class="btn btn-primary">Buy Now</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `)
                })

                document.querySelector(".data_output").innerHTML = inputdata.join("")

            })
    </script>
</body>

</html>
