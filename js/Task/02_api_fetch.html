<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <table class="table table-striped table-hover caption-top m-auto w-75">
        <caption class="text-center p-2 h2 text-primary">API Fatch: User data</caption>
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">First Name</th>
                <th scope="col">Last Name</th>
                <th scope="col">age</th>
                <th scope="col">Company Name</th>
            </tr>
        </thead>
        <tbody class="body">

        </tbody>
    </table>

    <script>
        fetch("https://dummyjson.com/users", {
            method: "GET"
        })
            .then((res) => {
                return res.json()
            })
            .then((res) => {
                // console.log(res.users)
                let htmldata = res.users.map((data) => {
                    console.log(data)
                    return (`
                        <tr>
                            <th scope="row">${data.id}</th>
                            <td>${data.firstName}</td>
                            <td>${data.lastName}</td>
                            <td>${data.age}</td>
                            <td>${data.company.name}</td>
                        </tr>
                    `)
                })
                document.querySelector(".body").innerHTML = htmldata.join("")
            })

        console.log("hello i am working")
    </script>
</body>

</html>
