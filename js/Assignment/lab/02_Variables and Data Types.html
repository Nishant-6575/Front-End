<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Hello this is asignment for variable and data type</h1>
    <h2>Please use consol for task validation</h2>
    <script>
        // String data type
        let a = "Hello"
        console.log(a)
        console.log(typeof (a))

        // number data type
        let b = 1234
        console.log(b)
        console.log(typeof (b))

        // boolean data type
        let c = true
        console.log(c)
        console.log(typeof (c))

        // null data type
        let d = null
        console.log(d)
        console.log(typeof (d))

        // undefined data type
        let e
        console.log(e)
        console.log(typeof (e))
    </script>
</body>

</html>
