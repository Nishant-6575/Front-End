<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>JavaScript Operators</h1>
    <h2>Please find task in consol</h2>

    <script>
        let a = 100
        let b = 50

        console.log(`a : ${a}`)
        console.log(`b : ${b}`)


        let add = a + b
        let sub = a - b
        let mul = a * b
        let div = a % b

        console.log(`Addiditon : ${add}`)
        console.log(`Substraction : ${sub}`)
        console.log(`Multipication : ${mul}`)
        console.log(`Division : ${div}`)

        // comparison operator
        console.log(`Check only value is equal or not : ${a == b}`)
        console.log(`Check only value and type is equal or not : ${a === b}`)
        console.log(`a is greater than b : ${a > b}`)
        console.log(`a is lesser than b : ${a < b}`)

        // logical operator
        console.log(`Check both value are in range of 0 to 100 :${(a >= 0 && a <= 100) && (b >= 0 && b <= 100)}`)
        console.log(`Check only one value are in range of 0 to 100 :${(a >= 0 && a <= 100) || (b >= 0 && b <= 100)}`)

    </script>
</body>

</html>
