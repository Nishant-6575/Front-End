<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Control Flow (If-Else, Switch)</h1>
    <h2>Please use consol for task</h2>

    <script>
        let a = 10

        // check the value of a
        if (a > 0) {
            console.log(`a is positive number : ${a}`)
        } else if (a < 0) {
            console.log(`a is negative number : ${a}`)
        } else {
            console.log(`a is zero : ${a}`)
        }

        let b = 1

        switch (b) {
            case 1:
                console.log("Monday")
                break;
            case 2:
                console.log("Tuesday")
                break;
            case 3:
                console.log("Wednesday")
                break;
            case 4:
                console.log("Thursday")
                break;
            case 5:
                console.log("Friday")
                break;
            case 6:
                console.log("Saturday")
                break;
            case 7:
                console.log("Sunday")
                break;
            default:
                console.log("Please input value from 1 to 7")
        }
    </script>
</body>

</html>
