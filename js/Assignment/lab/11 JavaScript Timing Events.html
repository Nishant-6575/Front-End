<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</head>

<body id="body">
    <h1>JavaScript Timing Events</h1>
    <div class="conntainer d-flex space-between justify-content-evenly fs-1 mt-5">
        <div class="text-center">
            <div id="hour"></div>
            <div>Hour</div>
        </div>
        <div class="text-center">
            <div id="min"></div>
            <div>Minutes</div>
        </div>
        <div class="text-center">
            <div id="sec"></div>
            <div>Seconds</div>
        </div>
    </div>
    <script>

        function changecolor() {
            console.log("Hello")
            document.getElementById("body").style.backgroundColor = "pink"
        }
        setTimeout(changecolor, 1000)

        // clock
        function clock() {
            let time = new Date()
            document.getElementById("hour").innerHTML = time.getHours()
            document.getElementById("min").innerHTML = time.getMinutes()
            document.getElementById("sec").innerText = time.getSeconds()
            console.log("hello")
        }
        setInterval(clock, 1000)

    </script>
</body>

</html>
