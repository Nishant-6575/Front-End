<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Object</h1>
    <h2>Please check consol for task completion</h2>

    <script>
        let car = {
            brand : "BMW",
            model : "X7",
            year : "2026"
        }
        console.log(car)
        
        // Access and print the car’s brand and model
        console.log(car.brand)
        console.log(car.model)

        // Update the year property
        car.year = "2025"

        console.log(car)

        // Add a new property color to the car object.
        car.color = "white"

        console.log(car)
    </script>
</body>
</html>
