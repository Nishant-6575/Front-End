<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>

</head>

<body>
    <div class="container mt-5" style="max-width: 700px;">
        <h1 class="text-center h1">Please fill up details</h1>
        <form class="row g-3" id="userform">
            <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" id="fn" onblur="return validate.validateform(fn,fnerr)">
                <span id="fnerr"></span>
            </div>
            <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" id="ln" onblur="return validate.validateform(ln,lnerr)">
                <span id="lnerr"></span>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="abc123@mail.com" id="mail"
                    onblur="return validate.validateform(mail,mailerr)">
                <span id="mailerr"></span>
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" maxlength="10"
                    onblur="return validate.validateform(phone,phoneerr)">
                <span id="phoneerr"></span>
            </div>
            <div class="col-12">
                <label class="form-label">Address</label>
                <textarea rows="5" cols="10" class="form-control" placeholder="1234 Main St" id="add"
                    onblur="return validate.validateform(add,adderr)"></textarea>
                <span id="adderr"></span>
            </div>
            <div class="col-md-6">
                <label class="form-label">City</label>
                <input type="text" class="form-control" id="city" onblur="return validate.validateform(city,cityerr)">
                <span id="cityerr"></span>
            </div>
            <div class="col-md-4">
                <label class="form-label">State</label>
                <select class="form-select" id="state" onblur="return validate.validateform(state,stateerr)">
                    <option selected>Choose...</option>
                    <option>a</option>
                    <option>b</option>
                    <option>c</option>
                </select>
                <span id="stateerr"></span>
            </div>
            <div class="col-md-2">
                <label class="form-label">Zip</label>
                <input type="text" class="form-control" id="zip" onblur="return validate.validateform(zip,ziperr)">
                <span id="ziperr"></span>
            </div>
            <div class="col-6">
                <label class="form-label">Aadhar Card Number</label>
                <input type="tel" class="form-control" id="aadhar" maxlength="12"
                    onblur="return validate.validateform(aadhar,aadharerr)">
                <span id="aadharerr"></span>
            </div>
            <div class="col-6">
                <label class="form-label">No. of Adult</label>
                <input type="number" min="1" max="10" class="form-control" id="no_adult"
                    onblur="return validate.validateform(no_adult,no_adulterr)">
                <span id="no_adulterr"></span>
            </div>
            <div class="col-md-6">
                <label class="form-label">Check in date</label>
                <input type="date" class="form-control" id="chkin"
                    onblur="return validate.validateform(chkin,chkinerr)">
                <span id="chkinerr"></span>
            </div>
            <div class="col-md-6">
                <label class="form-label">Check out date</label>
                <input type="date" class="form-control" id="chkout"
                    onblur="return validate.validateform(chkout,chkouterr)">
                <span id="chkouterr"></span>
            </div>
            <div class="col-12">
                <label class="form-label">Purpose of visit</label>
                <textarea rows="3" cols="10" class="form-control" id="purvisit"
                    onblur="return validate.validateform(purvisit,purvisiterr)"></textarea>
                <span id="purvisiterr"></span>
            </div>
            <div class="col-12 text-center">
                <button type="submit" class="btn btn-primary">Sign in</button>
            </div>
        </form>
    </div>

    <script src="/script.js"></script>

</body>

</html>
