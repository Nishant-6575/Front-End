<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Submissions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Hotel Guest Records</h2>

        <input type="text" id="search" class="form-control mb-3" placeholder="Search by Name or Check-in Date">

        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Adults</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="tableBody">

            </tbody>
        </table>

        <h4 id="nodata" class="text-center text-danger"></h4>

    </div>

    <script src="view.js"></script>

</body>

</html>
